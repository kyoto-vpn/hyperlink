<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening App...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Redirecting to app...</h2>
  <p>If the app does not open automatically, tap the button below:</p>
  <a id="app-btn" class="btn" href="#">Open App</a>

  <script>
    const rawTarget = window.location.hash.substring(1);

    if (rawTarget) {
      const targetUrl = decodeURIComponent(rawTarget);
      document.getElementById('app-btn').href = targetUrl;
      window.location.replace(targetUrl);
    } else {
      document.body.innerHTML = "<h3>Error: No destination protocol provided.</h3>";
    }
  </script>
</body>
</html>
