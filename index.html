<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090d16">
  <title>Opening App...</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .icon-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(59, 130, 246, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .icon-wrapper svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      font-size: 14px;
      font-weight: 500;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .error-state .spinner {
      display: none;
    }

    .error-state .icon-wrapper svg {
      stroke: var(--danger);
    }

    .error-state .btn-primary {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="icon-wrapper">
      <div class="spinner" id="spinner"></div>
      <svg id="status-icon" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
    </div>

    <h1 id="title"></h1>
    <p id="description"></p>

    <div class="btn-group">
      <a id="launch-btn" class="btn btn-primary" href="#"></a>
      <button id="copy-btn" class="btn btn-secondary" type="button"></button>
    </div>
  </div>

  <script>
  (function () {
    const i18n = {
      en: {
        pageTitle: "Opening App...",
        defaultTitle: "Opening Application",
        desc: "Launching external client. Tap the button below if nothing happens automatically.",
        openDefault: "Open App",
        openScheme: (s) => `Open ${s}`,
        copyBtn: "Copy Link",
        copied: "Copied to Clipboard!",
        copyFailed: "Copy Failed",
        missingTitle: "Missing Link",
        missingDesc: "No application protocol was supplied in the URL.",
        invalidTitle: "Invalid Protocol",
        invalidDesc: "Execution of this protocol format is blocked for security."
      },
      ru: {
        pageTitle: "Открытие приложения...",
        defaultTitle: "Открытие приложения",
        desc: "Запуск внешнего клиента. Нажмите кнопку ниже, если открытие не произошло автоматически.",
        openDefault: "Открыть приложение",
        openScheme: (s) => `Открыть ${s}`,
        copyBtn: "Скопировать ссылку",
        copied: "Скопировано в буфер!",
        copyFailed: "Не удалось скопировать",
        missingTitle: "Ссылка не найдена",
        missingDesc: "В URL-адресе не указан протокол приложения.",
        invalidTitle: "Недопустимый протокол",
        invalidDesc: "Запуск данного протокола заблокирован в целях безопасности."
      }
    };

    const userLang = (navigator.languages && navigator.languages.length)
      ? navigator.languages[0]
      : (navigator.language || navigator.userLanguage || "en");
    const lang = userLang.toLowerCase().startsWith("ru") ? "ru" : "en";
    const t = i18n[lang];

    document.documentElement.lang = lang;
    document.title = t.pageTitle;

    const card = document.getElementById('card');
    const title = document.getElementById('title');
    const desc = document.getElementById('description');
    const launchBtn = document.getElementById('launch-btn');
    const copyBtn = document.getElementById('copy-btn');
    const statusIcon = document.getElementById('status-icon');

    title.textContent = t.defaultTitle;
    desc.textContent = t.desc;
    launchBtn.textContent = t.openDefault;
    copyBtn.textContent = t.copyBtn;

    const rawHash = window.location.hash.substring(1);

    if (!rawHash) {
      showError(t.missingTitle, t.missingDesc);
      return;
    }

    function parsePayload(input) {
      let decoded = decodeURIComponent(input).trim();
      
      if (/^[a-zA-Z0-9+.-]+:\/\//.test(decoded)) {
        return decoded;
      }

      try {
        let b64 = decoded.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        
        const bin = atob(b64);
        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
        const utf8Decoded = new TextDecoder().decode(bytes).trim();

        if (/^[a-zA-Z0-9+.-]+:\/\//.test(utf8Decoded)) {
          return utf8Decoded;
        }
      } catch (_) {}

      return decoded;
    }

    const targetUri = parsePayload(rawHash);

    if (/^(javascript|data|vbscript):/i.test(targetUri)) {
      showError(t.invalidTitle, t.invalidDesc);
      return;
    }

    launchBtn.href = targetUri;

    const schemeMatch = targetUri.match(/^([a-zA-Z0-9+.-]+):\/\//);
    if (schemeMatch) {
      const scheme = schemeMatch[1].toUpperCase();
      title.textContent = t.openScheme(scheme);
      launchBtn.textContent = t.openScheme(scheme);
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(targetUri);
        const original = copyBtn.textContent;
        copyBtn.textContent = t.copied;
        setTimeout(() => { copyBtn.textContent = original; }, 1500);
      } catch (_) {
        copyBtn.textContent = t.copyFailed;
      }
    });

    window.location.replace(targetUri);

    function showError(heading, message) {
      card.classList.add('error-state');
      title.textContent = heading;
      desc.textContent = message;
      statusIcon.innerHTML = `
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      `;
      copyBtn.style.display = 'none';
    }
  })();
</script>
</body>
</html>
